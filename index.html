<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolashaq - Darhan Bektaban </title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .epigraph {
            text-align: center;
            line-height: 1.8;
        }
        .epigraph h2 {
            color: #58a6ff;
            font-size: 1.5rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .epigraph .subtitle {
            color: #8b949e;
            font-size: 1.1rem;
            margin-bottom: 30px;
            font-style: italic;
        }
        .poem-line {
            font-size: 1.15rem;
            margin: 8px 0;
            color: #f0f6fc;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="epigraph">
            <h2>Buigingi Taqyryp</h2>
            <div class="subtitle">Bolashaqqa Degen Uimit</div>
            
            <div class="poem-line">Ailde Bolashaqtan Ba</div>
            <div class="poem-line">Kim Bilsin</div>
            <div class="poem-line">Barynsha Suirinbej</div>
            <div class="poem-line">Uoimir Degendi</div>
            <div class="poem-line">Barynsha Tuisinip</div>
            <div class="poem-line">Qaj Qyrynan Bolmasyn</div>
            <div class="poem-line">Qurylysyn Zerttep Kuoirip</div>
            <div class="poem-line">Qaj Sala Bolmasyn</div>
            <div class="poem-line">Algha Qojghan Baghdargha</div>
            <div class="poem-line">Barynsha At Salysyp</div>
        </div>
    </div>

</body>
</html>
